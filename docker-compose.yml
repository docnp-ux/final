services:
  postgres:
    image: postgres:16-alpine
    container_name: solar-tracker-postgres
    environment:
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: solar
      POSTGRES_DB: solar_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: solar-tracker-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://solar:solar@postgres:5432/solar_tracker
      SECRET_KEY: change-me-to-a-real-secret-key
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Must be reachable from the browser (not the Docker network) —
        # the backend's own port is also published to the host below.
        VITE_API_URL: http://localhost:8000
    container_name: solar-tracker-frontend
    ports:
      # 3000 was already taken by an unrelated container on this machine.
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
