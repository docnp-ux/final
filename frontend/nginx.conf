server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-router handles routing client-side, so any
    # path that doesn't match a real file (e.g. /devices/register on a
    # hard refresh) should still serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
